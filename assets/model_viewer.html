<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <model-viewer 
      src="space_station_3.glb" 
      alt="Space Station 3D Model"
      auto-rotate
      rotation-per-second="0.1"
      camera-controls
      style="background-color: transparent;">
    </model-viewer>
  </body>
</html>
